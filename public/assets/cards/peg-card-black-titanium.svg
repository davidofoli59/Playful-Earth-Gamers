<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" width="100%" height="100%">
  <defs>
    <linearGradient id="blackTitaniumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c24" />
      <stop offset="35%" stop-color="#0d1017" />
      <stop offset="70%" stop-color="#080a0f" />
      <stop offset="100%" stop-color="#141822" />
    </linearGradient>
    <linearGradient id="silverFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#d0d7de" />
      <stop offset="60%" stop-color="#8c959f" />
      <stop offset="100%" stop-color="#f0f3f6" />
    </linearGradient>
    <linearGradient id="chipGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9d423" />
      <stop offset="50%" stop-color="#e2b11e" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>
    <linearGradient id="hologramGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e040fb" stop-opacity="0.2" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="10" y="10" width="836" height="520" rx="36" fill="url(#blackTitaniumBg)" stroke="url(#silverFoil)" stroke-width="2.5" filter="url(#cardShadow)"/>
  
  <!-- Subtle Brushed Texture Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.75">
    <line x1="10" y1="60" x2="846" y2="60" />
    <line x1="10" y1="120" x2="846" y2="120" />
    <line x1="10" y1="180" x2="846" y2="180" />
    <line x1="10" y1="240" x2="846" y2="240" />
    <line x1="10" y1="300" x2="846" y2="300" />
    <line x1="10" y1="360" x2="846" y2="360" />
    <line x1="10" y1="420" x2="846" y2="420" />
    <line x1="10" y1="480" x2="846" y2="480" />
  </g>

  <!-- Holographic Security Arc -->
  <circle cx="700" cy="140" r="160" fill="url(#hologramGlow)" filter="blur(20px)" />
  <path d="M 620 40 C 720 100, 780 200, 820 320" fill="none" stroke="url(#silverFoil)" stroke-width="1.5" opacity="0.25" stroke-dasharray="8 6"/>

  <!-- Card Header -->
  <g transform="translate(60, 55)">
    <!-- PEG Logo Icon -->
    <rect width="48" height="48" rx="14" fill="#040a12" stroke="#00ff87" stroke-width="2"/>
    <path d="M 14 18 C 14 12, 34 12, 34 18 L 36 30 C 37 36, 31 38, 27 34 L 24 31 L 21 34 C 17 38, 11 36, 12 30 Z" fill="none" stroke="#00ff87" stroke-width="2" />
    
    <text x="64" y="32" font-family="'Orbitron', sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="3">PLAYFUL EARTH GAMERS</text>
    <text x="64" y="47" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="13" fill="#8c959f" letter-spacing="2">BLACK TITANIUM VIP VIRTUAL CARD</text>
  </g>

  <!-- Contactless Wave Symbol -->
  <g transform="translate(730, 65)" stroke="url(#silverFoil)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M 0 30 A 20 20 0 0 1 0 0" />
    <path d="M 8 35 A 28 28 0 0 1 8 -5" />
    <path d="M 16 40 A 36 36 0 0 1 16 -10" />
    <path d="M 24 45 A 44 44 0 0 1 24 -15" />
  </g>

  <!-- EMV Smart Chip -->
  <g transform="translate(60, 150)">
    <rect width="90" height="70" rx="14" fill="url(#chipGold)" stroke="#3a2e05" stroke-width="1.5" />
    <!-- Chip Micro-circuits -->
    <rect x="0" y="22" width="90" height="26" fill="none" stroke="#5a4205" stroke-width="1" />
    <line x1="30" y1="0" x2="30" y2="70" stroke="#5a4205" stroke-width="1" />
    <line x1="60" y1="0" x2="60" y2="70" stroke="#5a4205" stroke-width="1" />
    <rect x="36" y="28" width="18" height="14" rx="4" fill="#2d2203" />
  </g>

  <!-- Security Holographic Stamp -->
  <g transform="translate(180, 160)">
    <circle cx="25" cy="25" r="25" fill="#141c28" stroke="#00f0ff" stroke-width="1.5" />
    <text x="25" y="23" font-family="'Orbitron', sans-serif" font-weight="900" font-size="9" fill="#00f0ff" text-anchor="middle">ZERO</text>
    <text x="25" y="34" font-family="'Orbitron', sans-serif" font-weight="700" font-size="8" fill="#ffffff" text-anchor="middle">TRUST</text>
  </g>

  <!-- 16-Digit Card Number (Embossed Look) -->
  <g transform="translate(60, 290)">
    <text x="0" y="0" font-family="'Courier New', monospace, monospace" font-weight="700" font-size="34" fill="url(#silverFoil)" letter-spacing="7">4832  9901  2488  7741</text>
  </g>

  <!-- Card Details: Expiry, CVV & Holder -->
  <g transform="translate(60, 370)">
    <text x="0" y="0" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="11" fill="#8c959f" letter-spacing="2">CARDHOLDER</text>
    <text x="0" y="24" font-family="'Orbitron', sans-serif" font-weight="700" font-size="18" fill="#ffffff" letter-spacing="2">SUPER ODDS CHAMPION</text>

    <text x="320" y="0" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="11" fill="#8c959f" letter-spacing="2">VALID THRU</text>
    <text x="320" y="24" font-family="'Orbitron', sans-serif" font-weight="700" font-size="18" fill="#ffffff" letter-spacing="2">09/30</text>

    <text x="440" y="0" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="11" fill="#8c959f" letter-spacing="2">CVV STATUS</text>
    <text x="440" y="24" font-family="'Orbitron', sans-serif" font-weight="700" font-size="18" fill="#00ff87" letter-spacing="2">TOKENIZED</text>
  </g>

  <!-- Bottom Badges: VISA & Paystack Guaranteed -->
  <g transform="translate(640, 410)">
    <!-- Visa / Mastercard holographic emblem -->
    <circle cx="45" cy="40" r="32" fill="#eb001b" opacity="0.9" />
    <circle cx="85" cy="40" r="32" fill="#f79e1b" opacity="0.9" />
    <text x="65" y="47" font-family="'Orbitron', sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle" font-style="italic">GLOBAL</text>
    <text x="65" y="90" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="11" fill="#8c959f" text-anchor="middle" letter-spacing="1">PAYSTACK CERTIFIED</text>
  </g>

  <!-- Multi-Currency Micro Badge -->
  <g transform="translate(60, 460)">
    <rect width="260" height="26" rx="8" fill="#040910" stroke="#253041" stroke-width="1"/>
    <text x="130" y="17" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="11" fill="#00f0ff" text-anchor="middle" letter-spacing="1.5">USD • NGN • GHS • KES • ZAR • EUR</text>
  </g>
</svg>
